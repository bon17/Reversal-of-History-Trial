# 게임 사이트 자동 올리기 (GitHub Pages)
#
# 이 브랜치에 고친 것을 올리면, 게임에 필요한 파일만 골라 `site` 브랜치를 새로 만든다.
# GitHub Pages가 `site` 브랜치를 보여 준다 (저장소 Settings → Pages → Branch: site, / (root)).
#   게임 1 (1~3화, 기억 노트):       https://bon17.github.io/Reversal-of-History-Trial/1/
#   게임 2 (4~6화, 친구에게 답장하기): https://bon17.github.io/Reversal-of-History-Trial/2/
#
# - 올리는 것: index.html, manifest.webmanifest, game/, assets/audio/ (소리 파일이 생기면)
# - 올리지 않는 것: docs/(대본, 정답, 교사용 메모), tools/, gas/, assets/의 원본 그림
# - 두 주소는 같은 게임 파일에 window.GAME_PART = 1 / 2 만 다르게 넣은 것이다
#   (HTML 한 파일 게임 1·2와 같은 방식. 그 게임의 화만 고를 수 있고, [처음부터]가 1화 / 4화).
# - 수업 브랜치를 바꾸면 아래 branches 의 이름도 바꾼다.

name: 게임 사이트 올리기

on:
  push:
    branches: [claude/nifty-edison-ajkflk]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /index.html
            /manifest.webmanifest
            /game/
            /assets/audio/
          sparse-checkout-cone-mode: false

      - name: 사이트 만들기 (site/1, site/2)
        run: |
          set -euo pipefail
          rm -rf site && mkdir site
          touch site/.nojekyll   # _manifest.json 처럼 _로 시작하는 파일도 그대로 올리게
          for N in 1 2; do
            D="site/$N"
            mkdir -p "$D/assets"
            cp -r game "$D/"
            if [ -d assets/audio ]; then cp -r assets/audio "$D/assets/"; fi
            sed -e "s|<head>|<head><script>window.GAME_PART=$N</script>|" \
                -e "s|<title>기억의 법정</title>|<title>기억의 법정 게임 $N</title>|" \
                index.html > "$D/index.html"
            sed -e "s|\"기억의 법정\"|\"기억의 법정 게임 $N\"|g" manifest.webmanifest > "$D/manifest.webmanifest"
            # 바꿔 넣기가 안 되었으면 여기서 멈춘다 (두 주소가 같은 게임이 되지 않게)
            grep -q "window.GAME_PART=$N" "$D/index.html"
            grep -q "<title>기억의 법정 게임 $N</title>" "$D/index.html"
          done
          find site -name .gitkeep -delete
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="ko">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>기억의 법정</title>
          <style>
            body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #000; color: #f3e6c4; font-family: sans-serif; padding: 16px; box-sizing: border-box; }
            h1 { font-size: 28px; margin: 0 0 8px; }
            a { display: block; width: min(320px, 100%); padding: 16px; text-align: center; border: 2px solid #c9a24a; border-radius: 10px; background: #13204a; color: #fff; text-decoration: none; font-size: 18px; box-sizing: border-box; }
          </style>
          </head>
          <body>
          <h1>기억의 법정</h1>
          <a href="1/">게임 1 · 제1화~제3화</a>
          <a href="2/">게임 2 · 제4화~제6화</a>
          </body>
          </html>
          EOF
          test ! -e site/docs && test ! -e site/1/docs && test ! -e site/2/docs
          du -sh site

      - name: site 브랜치에 올리기
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd site
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "게임 사이트 (${GITHUB_SHA::7}에서 만듦)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
