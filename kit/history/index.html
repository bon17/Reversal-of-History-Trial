<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>법정 추리 수업 게임</title>
<link rel="stylesheet" href="engine/css/game.css">
</head>
<body>
<!-- 이 파일을 두 번 누르면 게임이 열린다. 내 게임의 내용은 my-game/ 폴더의 파일만 고치면 된다. -->
<!--APP-->
<div id="app" class="land">
  <!-- 3:2 장면: 배경 → 인물 → 책상 앞그림 순서로 겹친다 -->
  <div id="stage">
    <div id="scene">
      <img id="bg" class="layer" alt="">
      <img id="cut" class="layer" alt="" hidden>
      <div id="rain" class="layer"></div>
      <img id="char" alt="" hidden>
      <img id="desk" class="layer" alt="" hidden>
    </div>
    <div id="photo" class="layer" hidden><img id="photo-img" alt=""><div class="caption" hidden></div></div>
    <div id="closeup" class="layer" hidden><img alt=""></div>
    <div id="glow" class="layer"></div>
    <div id="cards" class="layer"></div>
    <div id="hotspots" class="layer"></div>
    <div id="popup" class="layer" hidden></div>
    <div id="black" class="layer"><div id="subtitle"></div></div>
    <div id="flash" class="layer"></div>
    <div id="big" class="layer"></div>
    <div id="gauge" hidden></div>
  </div>

  <!-- 대사창과 버튼. 가로 화면에서는 장면 위에 겹치고, 세로 화면에서는 장면 아래에 놓인다 -->
  <div id="hud">
    <div id="topbar">
      <button id="btn-menu" class="round-btn" aria-label="설정">⚙</button>
      <button id="btn-full" class="round-btn" aria-label="전체 화면">⛶</button>
      <button id="btn-record" class="ui-btn act">사건 기록</button>
    </div>
    <div id="box" hidden>
      <div id="face"></div>
      <div id="name"></div>
      <div id="text"></div>
      <div id="text-measure" aria-hidden="true"></div>
      <div id="next-icon">▼</div>
    </div>
    <div id="choices" hidden></div>
    <div id="controls" hidden></div>
  </div>

  <div id="overlay"></div>
</div>
<!--/APP-->

<!-- 내 게임의 설정과 이야기(my-game/settings.js, story1.js, story2.js …)는 엔진이 알아서 불러온다.
     다른 폴더의 게임을 열려면 주소 끝에 ?game=폴더 를 붙인다 (예: index.html?game=examples/daedong-map) -->
<!-- 엔진 (고치지 않아도 된다) -->
<script src="engine/js/defaults.js"></script>
<script src="engine/js/core.js"></script>
<script src="engine/js/screen.js"></script>
<script src="engine/js/record.js"></script>
<script src="engine/js/play.js"></script>
<script src="engine/js/write.js"></script>
<script src="engine/js/check.js"></script>
<script src="engine/js/main.js"></script>
</body>
</html>
